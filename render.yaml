# Render 部署配置（放在仓库根目录，与 server.js 同级）
# 推送到 GitHub 后，在 Render 选择 "New" -> "Blueprint" 即可一键识别本文件。
services:
  - type: web
    name: tax-simulation
    runtime: node
    plan: free
    # 构建与启动命令
    buildCommand: npm install
    startCommand: node server.js
    # 健康检查（后端已提供）
    healthCheckPath: /api/health
    envVars:
      # 指定 Node 版本（避免平台默认过低）
      - key: NODE_VERSION
        value: "22"
      # JWT 签名密钥：Render 自动生成并永久保存，tokens 重启不失效（务必保留此项）
      - key: JWT_SECRET
        generateValue: true
      # 老师后台密码：部署时在 Render 后台手动填写（务必改成强密码！）
      - key: ADMIN_PASSWORD
        sync: false
      # 学员报名邀请码：部署时在 Render 后台手动填写（默认 财务多多888）
      - key: INVITE_CODE
        sync: false
